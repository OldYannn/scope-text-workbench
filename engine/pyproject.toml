[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "scope-research-engine-dev"
version = "0.0.0"
description = "Development package for the local SCOPE research engine"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jieba==0.42.1",
]

[project.optional-dependencies]
packaging = [
  "pyinstaller==6.21.0",
]
dev = [
  "mypy>=1.17,<2",
  "ruff>=0.12,<1",
]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.setuptools.package-data]
scope_engine = ["resources/stopwords/*.txt", "resources/stopwords/*.tsv", "resources/stopwords/*.md", "resources/stopwords/*.json", "resources/stopwords/upstream/*.txt"]
