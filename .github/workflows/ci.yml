name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Frontend and Python quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run format:check
      - run: npm run build

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml

      - run: python -m pip install -e "engine[dev]"
      - run: ruff check engine scripts
      - run: ruff format --check engine scripts
      - run: mypy engine/src engine/tests engine/packaging scripts
      - run: python -m unittest discover -s engine/tests -v

  desktop-host:
    name: Desktop package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: npm ci
      - run: python -m pip install -e "engine[packaging]"
      - id: sidecar_build
        run: python scripts/build_sidecar.py --expected-target ${{ matrix.target }}
      - id: sidecar_verify
        run: python scripts/verify_sidecar.py
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - id: rust_tests
        run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - id: production_build
        run: npm run tauri -- build --bundles ${{ matrix.bundles }}

      - name: Install Windows GUI E2E dependencies
        if: matrix.target == 'x86_64-pc-windows-msvc'
        run: npm ci --prefix tests/e2e

      - name: Verify production build excludes embedded WebDriver
        id: production_isolation
        if: matrix.target == 'x86_64-pc-windows-msvc'
        shell: pwsh
        run: |
          $productionTree = cargo tree --manifest-path apps/desktop/src-tauri/Cargo.toml --no-default-features
          if ($productionTree -match "tauri-plugin-wdio-webdriver") {
            throw "Production dependency graph includes the test-only WebDriver plugin."
          }
          cargo tree --manifest-path apps/desktop/src-tauri/Cargo.toml --features e2e --invert tauri-plugin-wdio-webdriver

      - name: Build Windows GUI E2E test application
        id: e2e_build
        if: matrix.target == 'x86_64-pc-windows-msvc'
        env:
          CARGO_TARGET_DIR: ${{ github.workspace }}/apps/desktop/src-tauri/target/e2e
        run: npm run tauri -- build --no-bundle --features e2e

      - name: Run Windows GUI E2E smoke test
        id: e2e_smoke
        if: matrix.target == 'x86_64-pc-windows-msvc'
        env:
          SCOPE_E2E_APP: ${{ github.workspace }}/apps/desktop/src-tauri/target/e2e/release/scope-desktop-dev.exe
        run: npm test --prefix tests/e2e

      - name: Verify macOS application bundle
        id: macos_bundle
        if: runner.os == 'macOS'
        run: python scripts/verify_macos_bundle.py "apps/desktop/src-tauri/target/release/bundle/macos/SCOPE 文镜 (Development).app"

      - name: Record platform validation evidence
        if: always()
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          SIDECAR_BUILD: ${{ steps.sidecar_build.outcome }}
          SIDECAR_VERIFY: ${{ steps.sidecar_verify.outcome }}
          RUST_TESTS: ${{ steps.rust_tests.outcome }}
          PRODUCTION_BUILD: ${{ steps.production_build.outcome }}
          PRODUCTION_ISOLATION: ${{ steps.production_isolation.outcome }}
          E2E_BUILD: ${{ steps.e2e_build.outcome }}
          E2E_SMOKE: ${{ steps.e2e_smoke.outcome }}
          MACOS_BUNDLE: ${{ steps.macos_bundle.outcome }}
        run: |
          automated=BLOCKED
          build=BLOCKED
          windows_gui_e2e=NOT_RUN
          if [[ "$SIDECAR_BUILD" == "success" && "$SIDECAR_VERIFY" == "success" && "$RUST_TESTS" == "success" ]]; then
            automated=PASS
          fi
          if [[ "$TARGET" == "x86_64-pc-windows-msvc" && "$PRODUCTION_BUILD" == "success" ]]; then
            build=PASS
          elif [[ "$TARGET" != "x86_64-pc-windows-msvc" && "$PRODUCTION_BUILD" == "success" && "$MACOS_BUNDLE" == "success" ]]; then
            build=PASS
          fi
          if [[ "$TARGET" == "x86_64-pc-windows-msvc" ]]; then
            windows_gui_e2e=BLOCKED
            if [[ "$PRODUCTION_ISOLATION" == "success" && "$E2E_BUILD" == "success" && "$E2E_SMOKE" == "success" ]]; then
              windows_gui_e2e=PASS
            fi
          fi
          mkdir -p validation-evidence
          {
            echo "TARGET=$TARGET"
            echo "AUTOMATED=$automated"
            echo "BUILD=$build"
            echo "WINDOWS_GUI_E2E=$windows_gui_e2e"
          } > "validation-evidence/$TARGET.env"

      - name: Upload platform validation evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-${{ matrix.target }}
          path: validation-evidence/${{ matrix.target }}.env
          if-no-files-found: warn

      - uses: actions/upload-artifact@v7
        with:
          name: scope-development-${{ matrix.target }}
          path: apps/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error

  validation-summary:
    name: Validation Summary
    if: always()
    needs: [quality, desktop-host]
    runs-on: ubuntu-latest
    env:
      QUALITY_RESULT: ${{ needs.quality.result }}
    steps:
      - name: Download platform validation evidence
        uses: actions/download-artifact@v7
        continue-on-error: true
        with:
          pattern: validation-*
          path: validation-evidence
          merge-multiple: true

      - name: Write validation summary
        shell: bash
        run: |
          automated_status=BLOCKED
          macos_arm64_status=BLOCKED
          macos_x64_status=BLOCKED
          windows_x64_status=BLOCKED
          windows_gui_e2e_status=BLOCKED
          platform_automated=PASS
          for evidence in validation-evidence/*.env; do
            [[ -f "$evidence" ]] || continue
            unset TARGET AUTOMATED BUILD WINDOWS_GUI_E2E
            source "$evidence"
            [[ "$AUTOMATED" == "PASS" ]] || platform_automated=BLOCKED
            case "$TARGET" in
              aarch64-apple-darwin) macos_arm64_status="$BUILD" ;;
              x86_64-apple-darwin) macos_x64_status="$BUILD" ;;
              x86_64-pc-windows-msvc)
                windows_x64_status="$BUILD"
                windows_gui_e2e_status="$WINDOWS_GUI_E2E"
                ;;
            esac
          done
          if [[ "$QUALITY_RESULT" == "success" && "$platform_automated" == "PASS" ]]; then
            automated_status=PASS
          fi
          {
            echo "## Validation Summary"
            echo
            echo "| Validation | Status |"
            echo "| --- | --- |"
            echo "| Automated Test | $automated_status |"
            echo "| macOS arm64 Build | $macos_arm64_status |"
            echo "| macOS x64 Build | $macos_x64_status |"
            echo "| Windows x64 Build | $windows_x64_status |"
            echo "| Windows GUI E2E | $windows_gui_e2e_status |"
            echo "| Computer Use GUI Test | NOT RUN |"
            echo "| Project Owner UAT | NOT RUN |"
            echo
            echo "> 摘要从每个 matrix Job 独立产生的证据文件汇总；证据缺失或步骤未成功时保守标记为 BLOCKED。"
          } >> "$GITHUB_STEP_SUMMARY"
