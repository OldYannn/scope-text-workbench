name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  quality:
    name: Frontend and Python quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run check
      - run: npm run lint
      - run: npm test
      - run: npm run format:check
      - run: npm run build

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: engine/pyproject.toml

      - run: python -m pip install -e "engine[dev]"
      - run: ruff check engine scripts
      - run: ruff format --check engine scripts
      - run: mypy engine/src engine/tests engine/packaging scripts
      - run: python -m unittest discover -s engine/tests -v

  desktop-host:
    name: Desktop package (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
          - os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - run: npm ci
      - run: python -m pip install -e "engine[packaging]"
      - run: cargo fmt --manifest-path apps/desktop/src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - run: python scripts/build_sidecar.py --expected-target ${{ matrix.target }}
      - run: python scripts/verify_sidecar.py
      - run: npm run tauri -- build --bundles ${{ matrix.bundles }}

      - name: Verify macOS application bundle
        if: runner.os == 'macOS'
        run: python scripts/verify_macos_bundle.py "apps/desktop/src-tauri/target/release/bundle/macos/SCOPE 文镜 (Development).app"

      - uses: actions/upload-artifact@v4
        with:
          name: scope-development-${{ matrix.target }}
          path: apps/desktop/src-tauri/target/release/bundle/**
          if-no-files-found: error
